name: Sync Courses

# Syncs courses and learning paths from Posit Academy into
# content/resources/courses/ and opens (or updates) a pull request with the
# changes. The "Protect main" ruleset requires a reviewed PR, so changes go
# live when the PR is merged, which triggers the production deploy.

on:
  schedule:
    - cron: "0 6 * * *" # 6 AM UTC, two hours before the nightly production deploy
  workflow_dispatch:

concurrency:
  group: sync-courses
  cancel-in-progress: false

# Pushing the branch and opening the PR use the app token below, not
# GITHUB_TOKEN, so that deploy-preview.yml runs on the sync PRs.
permissions:
  contents: read

jobs:
  sync-courses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Sync courses
        env:
          SKILLJAR_API_KEY: ${{ secrets.SKILLJAR_API_KEY }}
          # Keep log lines unwrapped in the job log and PR description
          COLUMNS: "200"
        run: |
          ./scripts/sync-courses.py 2>&1 | tee sync-courses.log

      - name: Write PR description
        run: |
          {
            echo "Nightly sync of [Posit Academy courses](https://academy.posit.co/page/all-courses) into \`content/resources/courses/\`."
            echo
            echo "Review the changes below, then approve and merge to publish them."
            echo
            echo "<details open><summary>Sync log</summary>"
            echo
            echo '```'
            grep -v "Skipped" sync-courses.log
            echo '```'
            echo
            echo "</details>"
            echo
            echo "To adjust a course, add \`include\`, \`exclude\`, or \`override\` blocks to its \`_index.md\`; see \`scripts/sync-courses.py\`."
          } > pr-body.md
          rm sync-courses.log

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.POSIT_OPEN_SOURCE_WEBSITE_SYNC_CLIENT_ID }}
          private-key: ${{ secrets.POSIT_OPEN_SOURCE_WEBSITE_SYNC_PEM }}

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: automation/sync-courses
          delete-branch: true
          add-paths: content/resources/courses
          commit-message: Sync courses from Posit Academy
          title: Sync courses from Posit Academy
          body-path: pr-body.md
