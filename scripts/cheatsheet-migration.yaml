  machine-learning-modelling-in-r:
    by: community
    old: Machine Learning Modelling in R
    title: Machine Learning Modelling in R
    description: Overview of supervised, unsupervised, and meta-algorithm approaches to machine learning
      in R, with a standard modelling workflow and time-series view.
    people:
    - Arnaud Amsellem
    languages:
    - R
    updated: 2018-03
    body: summary
    summary: |
      This cheat sheet provides a visual overview of common machine learning algorithms available in R, covering both supervised and unsupervised methods with their R package functions. It also illustrates meta-algorithms such as boosting and bagging, a standard modelling workflow for training and validation, and a time-series perspective on model deployment.

      ## What's covered
      - Supervised & unsupervised learning – algorithm descriptions and R functions for classification, regression, clustering, and dimensionality reduction
      - Meta-algorithms – boosting, bagging, stacking, and random forests
      - Time series & model validation – cross-validation and model selection strategies
      - Standard modelling workflow – training, validation, and production stages with simple and meta models
      - Time series view – train/validate/production split over time with simple and meta model aggregation
    sources: []
  mapsf:
    by: community
    old: mapsf
    title: Thematic maps with mapsf
    description: Create and export thematic maps from sf objects using choropleth, proportional symbol,
      and other map types.
    people:
    - Ronan Ysebaert
    languages:
    - R
    updated: 2021-11
    body: summary
    summary: |
      The mapsf package creates thematic maps from `sf` objects in R. It supports choropleth, typology, proportional symbol, graduated symbol, and combined map types, alongside flexible layout tools for titles, north arrows, scale bars, insets, and annotations. Maps can be exported to PNG or SVG with `mf_export()`.

      ## What's covered
      - Base map – `mf_map()` and `mf_get_mtq()` for loading sample data and rendering base layers
      - Symbology – choropleth, typology, proportional symbols, graduated symbols, combined types (`prop_choro`, `prop_typo`, `symb_choro`)
      - Legends – automatic default legends and `mf_legend()` customization
      - Colors – `mf_get_pal()` for asymmetric diverging palettes using `hcl.colors()`
      - Map layout – `mf_theme()`, `mf_title()`, `mf_arrow()`, `mf_scale()`, `mf_label()`, `mf_annotation()`, `mf_credits()`, insets
      - Export maps – `mf_export()` for PNG and SVG with theme, expanded bounding box, or area-centered output
    sources: []
  metrica:
    by: community
    old: metrica
    title: Prediction Performance with metrica
    description: Evaluate prediction accuracy of regression and classification models using more than
      80 performance metrics.
    people:
    - Carlos Hernandez
    - Adrian A. Correndo
    languages:
    - R
    updated: 2023-01
    body: summary
    summary: |
      The metrica package compiles over 80 functions for quantifying and visualizing prediction performance of point-forecast models for both continuous (regression) and categorical (classification) targets. Individual metrics such as `R2()`, `RMSE()`, and `accuracy()` share a common `obs`/`pred` interface, and `metrics_summary()` computes a selected list at once.

      ## What's covered
      - Basics – `obs` and `pred` arguments, `data` and `tidy` options shared by all functions
      - Installation – CRAN and GitHub development versions
      - Native datasets – built-in regression (wheat, barley, sorghum, chickpea) and classification (land_cover, maize_phenology) examples
      - Regression metrics – `R2()`, `RMSE()`, `KGE()`, and `metrics_summary()` for regression
      - Classification metrics – `accuracy()`, `precision()`, `recall()`, `fscore()`, and `metrics_summary()` for classification
      - Plots – `scatter_plot()` and `bland_altman_plot()`
      - Confusion matrix – `confusion_matrix()` for binary and multinomial cases
    sources:
    - path: powerpoints/metrica.pptx
      format: PowerPoint
    translations:
