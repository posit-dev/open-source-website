  samplingstrata:
    by: community
    old: SamplingStrata
    title: SamplingStrata
    description: Optimize the stratification of a sampling frame to minimize sample size given precision
      constraints on target estimates.
    people:
    - Giulio Barcaroli
    languages:
    - R
    updated: 2020-01
    body: summary
    summary: |
      The SamplingStrata package determines optimal stratification for survey sampling using an evolutionary algorithm. It supports three methods depending on the stratification variable type: atomic (categorical), continuous (with k-means pre-clustering), and spatial (for geo-referenced frames with spatial correlation). The workflow covers precision constraint definition, optimization, evaluation, and sample selection.

      ## What's covered
      - Optimal stratification – when to use atomic, continuous, or spatial methods
      - Method "atomic" – `buildStrataDF()`, `optimStrata(method = "atomic")`, `evalSolution()`, `selectSample()`
      - Method "continuous" – `KmeansSolution2()` for strata count suggestion, `prepareSuggestion()`, `optimStrata(method = "continuous")`
      - Method "spatial" – variogram fitting, `buildFrameSpatial()`, `optimStrata(method = "spatial")`
      - Precision constraints – `buildFrameDF()`, `cv` data frame with domain-level CV targets
      - Evaluation – `evalSolution()` and coefficient of variation per domain
      - Visualization – `plotStrata2d()` for strata by pairs of stratification variables
      - Use of models – `computeGamma()` for linking target variables to covariates via linear or log-linear models
    sources: []
  sas-r:
    by: community
    old: sas-r
    title: SAS <-> R
    description: Map common SAS data manipulation and plotting procedures to their tidyverse equivalents
      in R.
    people:
    - Brendan O'Dowd
    languages:
    - R
    software:
    - tidyverse
    updated: 2022-10
    body: summary
    summary: |
      The SAS <-> R cheat sheet shows side-by-side equivalents for common SAS data steps and procedures
      and their R counterparts using the tidyverse. It covers the full data manipulation workflow from
      importing and subsetting data to summarising, joining, pivoting, and plotting.

      ## What's covered
      - Introduction and setup – installing and loading tidyverse
      - Datasets; drop, keep, and rename variables
      - Conditional filtering
      - Sorting and row-wise operations
      - New variables and conditional editing – `mutate`, `if_else`, `case_when`
      - Counting and summarising – `count`, `group_by`, `summarise`
      - Combining datasets – `bind_rows`, `left_join`, and related joins
      - String manipulation – `str_detect`, `str_sub`, `str_replace_all`, `str_extract`
      - Transpose/pivot – `pivot_wider`, `pivot_longer`
      - Plotting in R – ggplot2 line, point, bar, and column charts
    sources:
    - path: powerpoints/sas-r.pptx
      format: PowerPoint
  sas-vs-r-in-pharma:
    by: community
    old: SASvsRinPharma
    title: SAS vs. R in Pharma
    description: Compare SAS and R data manipulation techniques commonly used in the pharmaceutical industry.
    people:
    - Bharath Kumar
    languages:
    - R
    updated: 2022-11
    body: summary
    summary: |
      This cheat sheet shows side-by-side SAS and R code for pharmaceutical data workflows, using
      clinical trial demo datasets (DM, VS, EX). It covers reading data, filtering, variable
      creation, deduplication, transposing, appending, and merging datasets.

      ## What's covered
      - Data inputs – creating datasets in SAS and data frames in R
      - Variable sorting – `arrange` vs. `proc sort`
      - Data filtering – `filter` vs. `if` statements
      - Data operations – keep, drop, and rename variables
      - Variable creation – `mutate` with derived variables and BMI calculation
      - Remove duplicate records – `slice(1)` vs. `nodupkey`
      - Data transformation: long to wide – `pivot_wider` vs. `proc transpose`
      - Data transformation: wide to long – `pivot_longer` vs. `proc transpose`
      - Data appending – `bind_rows` vs. `set`
      - Data merging – inner join and full join via `proc sql` and `dplyr`
    sources:
    - path: powerpoints/SASvsRinPharma.pptx
      format: PowerPoint
  sf:
    by: community
    old: sf
    title: Spatial manipulation with sf
    description: Work with geospatial vector data (points, lines, and polygons) using the sf package.
    people:
