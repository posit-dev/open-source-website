  packagefinder:
    by: community
    old: packagefinder
    title: Searching CRAN with packagefinder
    description: Search CRAN for R packages by keyword using the console or an RStudio add-in with ranking
      and filtering options.
    people:
    - Joachim Zuckarelli
    languages:
    - R
    updated: 2021-03
    body: summary
    summary: |
      The packagefinder package provides `findPackage()` for full-text keyword searches across CRAN package names, titles, and descriptions, with results displayed in the console, RStudio viewer, or browser. It ships with an RStudio add-in for graphical searches and helper functions for viewing package details and tracking new CRAN releases.

      ## What's covered
      - `findPackage()` – `keywords`, `mode` ("and"/"or"), `case.sensitive`, `limit.results`, `display`, `return.df`, `clipboard` arguments
      - Output options – console, viewer, and browser display; dataframe return; clipboard copy
      - RStudio add-in – graphical interface to `findPackage()` and `whatsNew()` with install and review features
      - Additional functions – `whatsNew()`, `packageDetails()`, `lastResults()`, `go()`, `fp()` shorthand
    sources: []
  parallel-computation:
    by: community
    old: parallel_computation
    title: Parallel computation
    description: Run R code in parallel using the parallel, future, foreach, and related packages across
      multiple CPU cores.
    people:
    - Ardalan Mirshani
    languages:
    - R
    updated: 2019-03
    body: summary
    summary: |
      This cheat sheet covers the main approaches to parallel computing in R, from the core `parallel` package with `makeCluster()` and `clusterApply()`, to the `future` and `future.apply` packages for asynchronous evaluation, and the `foreach` package with `doParallel` and `doFuture` backends. It also addresses load balancing for uneven task times.

      ## What's covered
      - Splitting strategies – by task or by data; hardware considerations (CPU cores, shared vs. distributed memory)
      - Map-reduce vs. master-worker models – Spark/Hadoop vs. snow/foreach approaches
      - `parallel` package – `makeCluster()`, `clusterApply()`, `clusterEvalQ()`, `clusterExport()`, `stopCluster()`
      - `foreach` – `%do%` (sequential) and `%dopar%` (parallel), `.combine`, `.packages`, `.export`
      - `doParallel` – `registerDoParallel()` backend for `foreach`
      - `future` – plan strategies, `%<-%` assignment operator
      - `future.apply` – `future_lapply()`, `future_sapply()`, `future_apply()`
      - `doFuture` – `registerDoFuture()` backend for `foreach`
      - Load balancing – `clusterApplyLB()`, `itertools::isplitVector()`
    sources: []
