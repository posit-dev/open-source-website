  cartography:
    by: community
    old: cartography
    title: Thematic maps with cartography
    description: Create thematic maps from sf and sp spatial objects with choropleth, symbol, typology,
      and basemap layers.
    people:
    - Timothée Giraud
    languages:
    - R
    updated: 2018-08
    body: summary
    summary: |
      cartography works alongside the sf and sp packages to produce thematic maps in R. It offers layer functions for representing quantitative and qualitative spatial data, spatial transformation utilities, and tools for composing full map layouts with north arrows, scale bars, and legends.

      ## What's covered
      - Choropleth layer – `choroLayer()` with classification methods
      - Typology layer – `typoLayer()`
      - Proportional symbols layer – `propSymbolsLayer()`
      - Colorized proportional symbols (relative) – `propSymbolsChoroLayer()`
      - Colorized proportional symbols (qualitative) – `propSymbolsTypoLayer()`
      - Double proportional symbols – `propTrianglesLayer()`
      - OpenStreetMap basemap – `getTiles()`, `tilesLayer()`
      - Polygons to grid transformation – `getGridLayer()`
      - Points to links transformation – `getLinkLayer()`
      - Polygons to borders – `getBorders()`
      - Polygons to pencil lines – `getPencilLayer()`
      - Map layout – `layoutLayer()`, `north()`, `barscale()`
      - Figure dimensions – `getFigDim()`
    sources: []
  collapse:
    by: community
    old: collapse
    title: Advanced and Fast Data Transformation with collapse
    description: Perform fast grouped, weighted, and panel-data statistical operations on R vectors, matrices,
      and data frames using C/C++.
    people:
    - Sebastian Krantz
    languages:
    - R
    updated: 2023-10
    body: summary
    summary: |
      collapse is a C/C++ based R package for advanced data transformation that is class-agnostic and compatible with base R, dplyr, data.table, and panel data classes. It provides fast statistical functions, flexible grouping objects, and efficient in-place data manipulation with minimal memory overhead and support for multithreading.

      ## What's covered
      - Introduction – design philosophy and compatibility
      - Fast statistical functions – `fmean()`, `fmedian()`, `fsum()`, `fsd()`, `fnth()`, and more
      - Grouping and ordering – `GRP()`, `fgroup_by()`, `qF()`, `radixorder()`
      - Fast data manipulation – `fselect()`, `fsubset()`, `fmutate()`, `fsummarise()`, `join()`, `pivot()`
      - Row/column arithmetic by reference – `%cr%`, `%r+%`, `setop()`
    sources:
    - path: latex/collapse
      format: LaTeX (Rnw)
      dir: true
