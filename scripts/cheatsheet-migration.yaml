  gwasrapidd:
    by: community
    old: gwasrapidd
    title: GWAS Catalog access with gwasrapidd
    description: Retrieve studies, associations, variants, and traits from the NHGRI-EBI GWAS Catalog
      REST API programmatically in R.
    people:
    - Ramiro Magno
    languages:
    - R
    updated: 2019-06
    body: summary
    summary: |
      gwasrapidd provides programmatic access to the GWAS Catalog, a manually curated database of published genome-wide association studies from the EMBL-EBI and NHGRI. Each of the four core catalog entities is mapped to an S4 R object, which can be retrieved, inspected, and subset.

      ## What's covered
      - Introduction – GWAS Catalog entities: studies, associations, variants, traits
      - Get GWAS Catalog entities – `get_studies()`, `get_associations()`, `get_variants()`, `get_traits()`
      - S4 class studies – slots and primary key
      - S4 class associations – slots and primary key
      - S4 class variants – slots and primary key
      - S4 class traits – EFO traits table
      - Manipulate cases – subset by identifier or position, `union()`, `bind()`
    sources: []
  h2o:
    by: community
    old: h2o
    title: h2o
    description: Work with H2O distributed in-memory data frames from R, covering data import, manipulation,
      math, and aggregation operations.
    people:
    - Juan Telleria Ruiz de Aguirre
    languages:
    - R
    updated: 2018-06
    body: summary
    summary: |
      The h2o R package provides an interface to the H2O distributed in-memory platform for scalable data processing and machine learning. This cheat sheet covers the full data workflow: importing and exporting files, converting between R and H2O objects, subscripting and subsetting H2O frames, performing vectorized math, and computing group-by and generic summaries.

      ## What's covered
      - Data import/export – `h2o.uploadFile()`, `h2o.importFile()`, `h2o.exportFile()`
      - Native R to H2O coercion – `as.h2o()`; H2O to R – `as.data.frame()`
      - Data generation – `h2o.createFrame()`, `h2o.runif()`
      - Data sampling/splitting
      - Subscripting and subsetting – `x[i,j]`, `h2o.head()`, `h2o.tail()`
      - Data attributes – `h2o.names()`, `h2o.dim()`, `h2o.nrow()`, `h2o.ncol()`
      - Data type coercion – `h2o.asfactor()`, `h2o.asnumeric()`, `h2o.as_date()`
      - Math operations – `h2o.abs()`, `h2o.sqrt()`, `h2o.log()`, cumulative functions
      - Group by summaries – `nrow`, `max`, `min`, `sum`, `mean`, `sd`
      - Generic summaries – `h2o.median()`, `h2o.cor()`, `h2o.quantile()`, `h2o.summary()`
      - Aggregations – row/column aggregation with `apply`
    sources:
    - path: powerpoints/h2o.pptx
      format: PowerPoint
  how-big-is-your-graph:
    by: community
    old: how-big-is-your-graph
    title: How big is your graph?
    description: Understand and control the size of base R graphics devices, margins, plotting regions,
      and coordinate systems using `par()`.
    people:
    - Steve Simon
    languages:
    - R
    updated: 2017-08
    body: summary
    summary: |
      This cheat sheet explains how to measure and manipulate the dimensions of base R graphics. It documents the `par()` parameters and helper functions that expose device size, margins, plotting region size, and user coordinate ranges, and shows how to convert between units.

      ## What's covered
      - Your graphics device – `dev.size()`, `par("din")` for width and height in inches, cm, or pixels
      - Your plot margins – `par("mai")` in inches, `par("mar")` in lines
      - Your plotting region – `par("pin")` size, `par("plt")` as fraction of device
      - Your x-y coordinates – `par("usr")` for user coordinate range
      - Getting a square graph – `par(pty="s")`
      - Converting units – translating user coordinates to pixels or inches
    sources: []
  imputets:
    by: community
    old: imputeTS
    title: imputeTS
    description: Impute missing values in univariate numeric time series using interpolation, Kalman smoothing,
      moving averages, and seasonal methods.
    people: []
    languages:
    - R
    updated: 2020-08
    body: summary
    summary: |
      imputeTS specializes in missing value imputation for univariate, equally-spaced numeric time series, with a focus on sensor and IoT data. It offers multiple imputation algorithms, ggplot2-based diagnostic plots for understanding and evaluating missing data patterns, and works naturally in tidy pipe workflows.

      ## What's covered
      - Mission, features, and scope – univariate numeric equally-spaced time series
      - Imputation algorithms – `na_interpolation()`, `na_kalman()`, `na_locf()`, `na_ma()`, `na_mean()`, `na_random()`, `na_seadec()`, `na_seasplit()`, `na_replace()`, `na_remove()`
      - Missing data overview plots – `ggplot_na_distribution()`, `ggplot_na_intervals()`, `ggplot_na_gapsize()`
      - Imputation analysis plots – `ggplot_na_imputations()` for evaluating imputation quality
      - Workflows – pipe-based usage with forecast packages
      - Datasets – `tsAirgap`, `tsNH4`, `tsHeating`
    sources:
    - path: powerpoints/imputeTS.pptx
      format: PowerPoint
  introduccion-a-r:
    by: community
    old: introduccion-a-r
    old_pdf: translations/spanish/introduccion-a-r.pdf
    title: Introducción al lenguaje R
    description: Introduces R data types, structures, packages, and basic workspace operations for Spanish-speaking
      beginners.
    people:
    - Rosana Ferrero
    languages:
    - R
    updated: 2018-06
    body: summary
    summary: |
      This cheat sheet is in Spanish. It covers the fundamental building blocks of R for beginners:
      getting help, using packages, and working with R's main data structures including vectors,
      matrices, data frames, and lists.

      ## What's covered
      - Getting help – `?`, `help.search`, `help(package=...)`
      - Data types overview – vectors, factors, matrices, arrays, lists, and data frames
      - Using packages – `install.packages`, `library`, accessing package functions
      - Vectors and factors – creating, selecting by position and value, `unique`, `sort`, `length`
      - Matrices – `matrix`, selecting rows/columns/elements, `t` (transpose), `%*%` (multiplication)
      - Data frames – `data.frame`, selecting columns and rows, `View`, `head`, `nrow`, `cbind`, `rbind`
      - Lists – `list`, selecting by index, name, and `$`
      - Working directory and assignment
    sources: []
  jfa:
    by: community
    old: jfa
    title: Audit sampling with jfa
    description: Plan, select, and evaluate audit samples using classical or Bayesian statistics with
      a five-function workflow.
    people:
    - Koen Derks
    languages:
    - R
    updated: 2021-09
    body: summary
    summary: |
      jfa implements the standard audit sampling workflow in R, supporting both classical and Bayesian inference. The package provides five main functions that map to the sequential steps of an audit: specifying a prior, calculating sample size, selecting items, evaluating misstatement, and generating a report.

      ## What's covered
      - Basics – installation, workflow overview, and example dataset (`BuildIt`)
      - Construct a prior distribution – `auditPrior()` with likelihood and method arguments
      - Calculate the minimum sample size – `planning()` with materiality, expected errors, and likelihood
      - Select items from the population – `selection()` with random, cell, or fixed-interval sampling
      - Evaluate the misstatement – `evaluation()` with classical or Bayesian methods
      - Create a report – `report()` generating an HTML summary of results
    sources:
    - path: powerpoints/jfa.pptx
      format: PowerPoint
