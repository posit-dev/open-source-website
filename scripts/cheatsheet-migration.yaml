  oscr:
    by: community
    old: oSCR
    title: oSCR
    description: Fit spatial capture-recapture models to estimate wildlife population density and detection
      probability.
    people:
    - Gabriela Palomo-Munoz
    languages:
    - R
    updated: 2019-12
    body: summary
    summary: |
      The oSCR package (pronounced "Oscar") implements spatial capture-recapture (SCR) models for wildlife population analysis. Following a workflow modeled after the unmarked package, users format encounter and trap-deployment data into a `scrFrame`, define the state space, fit likelihood-based models, and post-process results to obtain density and detection estimates.

      ## What's covered
      - Getting the package – GitHub installation with `install_github("jaroyle/oSCR")`
      - Format sampling data – encounter data file (edf), trap deployment file (tdf), `data2oscr()`, `scrFrame` structure and summary
      - Create the state space – `make.ssDF()` with varying buffer and spatial resolution
      - Modelling framework – single-session, multi-session, sex-structured, and multi-session sex-structured models
      - Analyze the data – likelihood-based model fitting with AIC model selection
      - Post-processing output – `get.real()` for back-transforming density, detection, and sigma estimates
    sources: []
  overviewr:
    by: community
    old: overviewR
    title: overviewR
    description: Generate tables and plots summarizing the time and scope conditions of a panel dataset.
    people:
    - Cosima Meyer
    - Dennis Hammerschmidt
    languages:
    - R
    updated: 2022-09
    body: summary
    summary: |
      The overviewR package helps researchers inspect the temporal and cross-sectional coverage of panel datasets. It produces summary tables (`overview_tab()`), cross-tabulations (`overview_crosstab()`), ggplot2-based sample and NA plots, and LaTeX-ready output compatible with knitr and flextable.

      ## What's covered
      - `overview_tab()` – collapse time conditions by unit ID, including complex date columns
      - `overview_crosstab()` – cross-tabulate units by two threshold-based conditions
      - `overview_na()` – horizontal ggplot2 bar chart of missing values per variable
      - `overview_plot()` – ggplot2 graphic of sample coverage over time
      - `overview_crossplot()` – visualize cross-tabulation conditions as a scatter plot
      - Export tables – `overview_latex()` for LaTeX output with `save_out` and `file_path` options
      - Workflows – tidyverse pipe integration and compatibility with knitr `kable()` and ggplot2 `ggsave()`
    sources:
    - path: keynotes/overviewR.key
      format: Keynote
