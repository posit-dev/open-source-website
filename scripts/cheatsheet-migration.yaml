  gganimate:
    by: community
    old: gganimate
    title: Animate ggplots with gganimate
    description: Add animation to ggplot2 plots by specifying transitions, view changes, enter/exit effects,
      and easing.
    people:
    - Karl Hailperin
    languages:
    - R
    updated: 2019-05
    body: summary
    summary: |
      gganimate extends the ggplot2 grammar of graphics with animation by adding four groups of functions to existing plots. Animations are driven by transition functions that determine what changes, optionally combined with view functions, enter/exit effects, shadows, and easing specifications.

      ## What's covered
      - Core concepts – transition, view, enter/exit, shadow, ease function groups
      - `transition_states()` – cycling between discrete variable values
      - `transition_time()` – continuous time-based transitions
      - `transition_reveal()` – cumulative data reveal along an axis
      - `transition_filters()` – cycling between filter conditions
      - Other transitions – `transition_manual()`, `transition_layers()`, `transition_events()`
      - `view_follow()` – axes track the data
      - `view_step()` – step through views at a controlled pace
      - `view_zoom()` – zoom and pan between views
      - `ease_aes()` – control pace of change between transition values
    sources: []
  git-github:
    by: community
    old: git-github
    title: Using Git and GitHub with RStudio
    description: Version-control R projects with Git and collaborate via GitHub directly from the RStudio
      IDE.
    people:
    - Mouna Belaid
    languages:
    - R
    updated: 2022-01
    body: summary
    summary: |
      This cheat sheet covers using Git and GitHub from within RStudio, starting from installation and initial configuration through to everyday version-control and collaboration workflows. It documents common Git commands alongside their RStudio equivalents.

      ## What's covered
      - Requirements and setup – installing Git, registering a GitHub account
      - Introduce yourself to Git – `git config --global user.name` and `user.email`
      - Basics – `git init`, `git clone`, `git add`, `git commit`, `git status`, `git log`, `git diff`
      - Remote repositories – `git remote add`, `git fetch`, `git pull`, `git push`
      - Undoing changes – `git revert`, `git reset`, `git clean`
      - Rewriting Git history – `git commit --amend`, `git rebase`, `git reflog`
      - Git branches – creating, listing, and switching branches
    sources:
