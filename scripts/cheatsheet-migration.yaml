      people:
      - Riva Quiroga
      source: translations/spanish/syntax_es.key
  teachr:
    by: community
    old: teachR
    title: teachR
    description: Design, deliver, and improve R teaching sessions using evidence-based pedagogy techniques.
    people:
    - Adi Sarid
    languages:
    - R
    updated: 2019-03
    body: summary
    summary: |
      teachR is a cheat sheet for R instructors covering the full teaching cycle: designing courses
      for specific learner personas, structuring lectures with conceptual maps and faded examples,
      running interactive sessions, and using feedback to improve. It draws on Bloom's taxonomy and
      other pedagogical frameworks.

      ## What's covered
      - Learner persona analysis – the R novice and the R "false expert"
      - Defining goals using Bloom's taxonomy
      - Designing lectures with conceptual maps
      - Writing the "final exam" and turning concepts into slides
      - Faded examples – fill-in-the-blank exercises
      - During the course – sticky notes, live polls, and check-in techniques
      - After the course – measuring time and using feedback
      - Useful tips and reading resources
    sources: []
  tidyeval:
    by: posit
    old: tidyeval
    title: Tidy evaluation with rlang
    description: Use the rlang package to write functions that work with tidyverse-style non-standard
      evaluation, quosures, and quasiquotation.
    people:
    - Garrett Grolemund
    - Mine Çetinkaya-Rundel
    languages:
    - R
    software:
    - rlang
    updated: 2018-11
    body: summary
    summary: |
      Tidy evaluation is a framework for non-standard (delayed) evaluation in R that makes it easier to program with tidyverse functions. This cheat sheet covers the key vocabulary and the rlang functions used to quote, unquote, and evaluate code.

      ## What's covered
      - Vocabulary – symbols, environments, constants, call objects, expressions, quosures, and expression vectors
      - Quoting Code – `quo()`, `enquo()`, `quos()`, `enquos()` for quosures; `expr()`, `enexpr()`, `exprs()`, `enexprs()` for expressions; `ensym()` for symbols
      - Parsing and Deparsing – `parse_expr()`, `expr_text()`, `quo_name()`
      - Building Calls – `call2()`, `exec()` for constructing and evaluating calls
      - Evaluation – `eval_bare()`, `eval_tidy()`, data masks, and the `.data$` pronoun
      - Quasiquotation – `!!` (unquote), `!!!` (unquote-splice), `:=` (unquote in LHS)
      - Programming Recipes – writing functions that recognize quasiquotation operators
    sources:
    - path: keynotes/tidyeval.key
      format: Keynote
    - path: powerpoints/tidyeval.pptx
      format: PowerPoint
    translations:
    - file: translations/spanish/tidyeval_es.pdf
      language: Spanish
      lang: es
      edition: rlang 0.3.0
      updated: 2019-10
      source: translations/spanish/tidyeval_es.pptx
