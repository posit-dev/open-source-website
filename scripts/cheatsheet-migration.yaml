    - Carson Sievert
    software:
    - shinychat
    updated: 2026-08
    body: summary
    summary: |
      shinychat adds AI chatbot interfaces to Shiny apps in both R and Python. It integrates with ellmer for LLM provider connections and handles streaming, rich markdown rendering, and built-in conversation history automatically.

      ## What's covered
      - Connect to LLM – `chat_anthropic()`, `chat_openai()`, `chat_google()`, and other ellmer providers
      - Create a basic chatbot – `chat_ui()`, `chat_server()`, and `shinyApp()` wiring
      - Quickly iterate – `live_browser()` for one-line chat app launch
      - First impression – custom greetings and suggestion markup via `chat_ui(greeting=)`
      - Layouts – screen-filling (`page_fillable()`), sidebar (`page_sidebar()`), and card layouts
      - Built-in chat features – conversation history, attachments, cancel/edit, thinking display, rich streaming output
      - Opt-in features – greetings, suggestions, slash commands
      - Tool displays – automatic and customizable display of tool calls for transparency
      - Slash commands – `chat$slash_command()` for shortcuts like clearing history
    sources:
    - path: keynotes/shinychat.key
      format: Keynote
  sjmisc:
    by: community
    old: sjmisc
    title: sjmisc
    description: Transform and recode variables in data frames using sjmisc alongside dplyr and pipes.
    people:
    - Daniel Lüdecke
    languages:
    - R
    updated: 2017-08
    body: summary
    summary: |
      sjmisc complements dplyr with functions for data transformation and variable recoding, designed
      to work with pipes and labelled data. Functions follow the tidyverse convention of
      taking the data as the first argument and returning the same type as the input.

      ## What's covered
      - Design philosophy – vector and data frame input, ellipsis argument for variable selection
      - Frequency tables – `frq`, `flat_table`, `count_na`
      - Descriptive summary – `descr`
      - Finding variables in a data frame – `find_var`
      - Recode and transform variables – `rec`, `dicho`, `split_var`, `group_var`, `std`, `recode_to`
      - Summarise variables and cases – `row_sums`, `row_means`, `row_count`
      - Other useful functions – `add_columns`, `set_na`, `remove_var`, `group_str`, `to_long`, `merge_df`
    sources: []
  slackr:
    by: community
    old: slackr
    title: slackr
    description: Send files, messages, R objects, and images to Slack directly from R.
    people:
    - Daniel M. Villarreal
    languages:
    - R
    updated: 2021-03
    body: summary
    summary: |
      The slackr package lets R users post results and outputs directly to Slack channels, including
      ggplot2 graphics, R objects saved as RData files, and plain text messages. It supports both
      single-channel webhook bots and fully authenticated multi-channel bots.

      ## What's covered
      - Installation – CRAN and development versions
      - Setup – creating a Slack app and configuring OAuth scopes
      - Single-channel bot setup – incoming webhook configuration
      - Multi-channel bot setup – OAuth token and scope configuration
      - Common functions – `ggslackr`, `save_slackr`, `slackr_bot`, `slackr_delete`, `slackr_msg`, `slackr_upload`
      - Other utility functions – `auth_test`, `call_slack_api`, `slackr_channels`, `slackr_users`, `with_pagination`
      - Vignettes – webhook, scoped bot, and usage guides
    sources: []
