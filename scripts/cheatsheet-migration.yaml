  squeakr:
    by: community
    old: SqueakR
    title: SqueakR
    description: Manage and analyze ultrasonic vocalization data from DeepSqueak using R.
    people:
    - Simon Ogundare
    languages:
    - R
    updated: 2022-06
    body: summary
    summary: |
      SqueakR is an R package for managing and visualizing ultrasonic vocalization (USV) data produced
      by the DeepSqueak detection software. It organizes scored call data into experiment objects and
      provides a code-free Shiny dashboard as well as direct plotting functions in RStudio.

      ## What's covered
      - Adding new data – `add_timepoint_data`, `score_timepoint_data`, `add_to_experiment`
      - Managing experiment objects – structure and navigation of the experiment object
      - SqueakR pipelines – `semisqueakRpipeline` (semi-automatic) and `autosqueakRpipeline` (Google Sheets)
      - Visualizations – graphs generated from scored call data
      - SqueakR Dashboard – Shiny interface for visualization and analysis without code
      - Learning – Swirl-based interactive tutorial
    sources:
    - path: keynotes/SqueakR.key
      format: Keynote
  srvyr:
    by: community
    old: srvyr
    title: survey data analysis with srvyr
    description: Analyze complex survey data with dplyr-style syntax using srvyr.
    people:
    - Greg Freedman Ellis
    - Ben Schneider
    languages:
    - R
    updated: 2025-01
    body: summary
    summary: |
      srvyr wraps the survey package to bring dplyr-compatible syntax to weighted survey analysis.
      It handles stratified, clustered, and multistage sample designs and returns weighted estimates
      along with standard errors and confidence intervals.

      ## What's covered
      - Describing the survey design – `as_survey_design` with ids, strata, fpc, and weights arguments
      - Replicate weights – `as_survey_rep`, replication types, and scale factors
      - Dealing with lonely PSUs – `survey.lonely.psu` option settings
      - Database-backed surveys – using `tbl()` with `as_survey_design`
      - Manipulating data – `filter` and `mutate` on design objects
      - Summarizing functions – `summarize`, `survey_count`, `group_by`
      - Statistical summary functions – `survey_total`, `survey_mean`, `survey_prop`
      - Standard errors and confidence intervals – `vartype` argument (se, ci, var, cv)
      - Proportions and percentages
    sources:
    - path: powerpoints/srvyr.pptx
      format: PowerPoint
  stata2r:
    by: community
    old: stata2r
    title: Stata to R
    description: Translate common Stata econometrics commands to their base R equivalents.
    people:
    - Anthony Nguyen
    languages:
    - R
    updated: 2019-10
    body: summary
    summary: |
      Stata to R maps Stata commands for econometric workflows to R equivalents, using datasets from
      Wooldridge's Introductory Econometrics. It covers data exploration, variable manipulation,
      model estimation, and postestimation, with notes on key differences between the two environments.

      ## What's covered
      - Setup – installing the `wooldridge` package and loading datasets
      - Basic plots – histogram, scatter plot, fitted line, and boxplot
      - Summarize data – `browse`, `describe`, `summarize`, `tabulate` equivalents
      - Create and edit variables – generating, dropping, keeping, recoding, and creating dummies
      - Estimate models: OLS – `lm`, robust and clustered standard errors via `estimatr`
      - Estimate models: MLE – logit, probit, and tobit regression
      - Estimate models: panel/longitudinal – fixed effects with `plm`
      - Estimate models: instrumental variables (2SLS) – `ivreg` from the AER package
      - Postestimation – `predict`, residuals, and diagnostic tests
    sources:
    - path: powerpoints/stata2r.pptx
      format: PowerPoint
