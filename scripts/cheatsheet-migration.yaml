# Cheat sheet migration manifest: per-sheet data used by
# scripts/migrate-cheatsheet.py to build content/resources/cheatsheets/<slug>/
# from a local clone of the old rstudio/cheatsheets repository.
# Paths (old, sources, translations[].file/source) are relative to that clone.
# See PLAN-CHEATSHEETS.md for how these values were determined.
old_repo: https://github.com/rstudio/cheatsheets
old_commit: 1e5e2bd
sheets:
  admiral:
    by: community
    old: admiral
    title: admiral
    description: Build CDISC ADaM datasets in R using modular, composable derivation functions from the
      pharmaverse.
    people:
    - Stefan Bundfuss
    languages:
    - R
    updated: 2024-07
    body: summary
    summary: |
      admiral is an open-source, modularized R toolbox for developing CDISC ADaM analysis datasets. It is built around interchangeable function blocks—individual `derive_*` calls—that are chained together to sequentially add variables and parameters to a dataset. It is part of the pharmaverse ecosystem of clinical reporting packages.

      ## What's covered
      - What you need to know – introduction to the ADaM workflow
      - Generic variable-adding functions – `derive_vars_merged()`, `derive_vars_joined()`, and related
      - Generic parameter-adding functions – `derive_param_computed()`, `derive_extreme_records()`
      - Functions treating days/dates/datetimes – `derive_vars_dt()`, `derive_vars_dy()`, `derive_vars_duration()`
      - Special variable-adding functions – age, period, toxicity grade, baseline/change
      - Special parameter-adding functions
      - Higher order functions – `call_derivation()`, `restrict_derivation()`
      - Computation functions for vectors – `compute_age_years()`, `compute_duration()`
      - Templates – `list_all_templates()`, `use_ad_template()`
      - Utilities – `convert_blanks_to_na()`, `filter_exist()`
    sources:
    - path: powerpoints/admiral.pptx
      format: PowerPoint
  arrow:
    by: community
    old: arrow
    title: Arrow for R
    description: Read, write, and manipulate larger-than-memory datasets using the Apache Arrow C++ library
      from R.
    people:
    - Mauricio Vargas
    languages:
    - R
    software:
    - dplyr
    updated: 2022-02
    body: summary
    summary: |
      arrow gives R users access to the Apache Arrow C++ library, a language-independent columnar memory format designed for efficient analytics. It provides dplyr-compatible operations on datasets too large to fit in memory, and enables zero-copy data sharing between R and Python.

      ## What's covered
      - Arrow data structures – Table and Dataset objects
      - Read individual files – `read_parquet()`, `read_feather()`, `read_csv_arrow()`
      - Read multi-file datasets – `open_dataset()` with format and partitioning options
      - Write individual files – `write_parquet()`, `write_feather()`, compression options
      - Write multi-file datasets – `write_dataset()` with partitioning
      - Manipulate larger-than-memory datasets – dplyr verbs with `collect()`
      - Zero-copy R and Python data sharing – reticulate and pyarrow integration
      - Cloud storage support (S3) – reading and writing from S3 URIs
    sources:
    - path: powerpoints/arrow.pptx
      format: PowerPoint
  base-r:
    by: community
    old: base-r
    title: Base R
    description: Core R syntax and functions covering help, packages, vectors, data I/O, programming structures,
      and probability distributions.
    people:
    - Mhairi McNeill
    languages:
    - R
    updated: 2015-03
    body: summary
    summary: |
      This cheat sheet covers the built-in R language and functions available without loading any external packages. It spans the building blocks of R programming, from interactive help and package management to vectors, data frames, control flow, and statistical distributions.

      ## What's covered
      - Getting help – `?`, `help.search()`, `help(package=)`
      - Working directory – `getwd()`, `setwd()`
      - Using packages – `install.packages()`, `library()`
      - Creating vectors – `c()`, `:`, `seq()`, `rep()`
      - Vector functions – `sort()`, `rev()`, `table()`, `unique()`
      - Selecting vector elements – by position and by value
      - Reading and writing data – `read.table()`, `read.csv()`, `write.csv()`
      - Programming – for loops, while loops, if/else statements, functions
      - Distributions – density, distribution, quantile, and random functions
