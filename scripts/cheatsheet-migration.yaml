  bayesplot:
    by: community
    old: bayesplot
    title: bayesplot
    description: Visualize posterior distributions, MCMC diagnostics, and posterior predictive checks
      for Bayesian models.
    people:
    - Edward A. Roualdes
    languages:
    - R
    updated: 2020-06
    body: summary
    summary: |
      bayesplot provides ggplot2-based plotting functions for assessing Bayesian models fit with Stan or other samplers. It is designed to work directly with posterior draw arrays and integrates with rstanarm and other Stan-based packages.

      ## What's covered
      - Model parameters – `mcmc_areas()` for posterior distribution plots with credible intervals
      - MCMC traceplots – `mcmc_trace()` for convergence diagnosis
      - Pairs plots – `mcmc_pairs()` for detecting correlated parameters
      - Posterior predictive checks – `ppc_intervals()`, `ppc_stat_grouped()` using `posterior_predict()`
      - NUTS diagnostics – `mcmc_nuts_energy()` for energy diagnostic plots
    sources: []
  bcea:
    by: community
    old: bcea
    title: BCEA
    description: Perform Bayesian cost-effectiveness analysis on posterior samples of costs and clinical
      benefits for multiple interventions.
    people:
    - Gianluca Baio
    languages:
    - R
    updated: 2021-02
    body: summary
    summary: |
      BCEA (Bayesian Cost-Effectiveness Analysis) takes simulated posterior samples of costs and effectiveness for two or more interventions and computes the standard suite of health economic statistics. Analysis parameters can be set at construction, via setter functions, or at plot time, providing flexible control over reference and comparison groups.

      ## What's covered
      - Introduction – `bcea()` constructor and constituent functions
      - Value assignment – three equivalent ways to set reference and comparison
      - Selecting analysis interventions – default, set reference, set comparisons
      - Expected incremental benefit – `eib.plot()`
      - Cost-effectiveness acceptability curve – `ceac_plot()`
      - Cost-effectiveness plane – `ceplane_plot()`
      - Cost-effectiveness planes with contours – `contour[2]()`
      - Expected value of information – `evi.plot()`
      - Expected value of perfect partial information – `plot.evppi()`
      - Grid of CE plane, EIB, EVI, and CEAC – `plot.bcea()`
      - Summarise data – `summary.bcea()`, `sim.table()`, `make.report()`
    sources: []
  caret:
    by: posit
    old: caret
    title: caret
    description: Train and tune machine learning models in R with caret's unified interface, covering
      preprocessing, resampling, performance metrics, and parallel processing.
    people:
    - Garrett Grolemund
    - Mine Çetinkaya-Rundel
    - Max Kuhn
    languages:
    - R
    updated: 2017-09
    body: summary
    summary: |
      The caret (Classification And REgression Training) package provides a consistent interface to over 200 predictive modeling algorithms in R. It wraps the training, tuning, and evaluation steps into a single workflow centered on the `train()` function.

      ## What's covered
      - Specifying the Model – formula, `x`/`y`, and recipe interfaces to `train()`
      - Preprocessing – `preProc` options for centering, scaling, imputation, and filtering
      - Adding Options – `trainControl()` for resampling and other settings
      - Resampling Options – k-fold CV, repeated CV, bootstrap, LGOCV, LOO, time-slice
      - Performance Metrics – `summaryFunction` with `defaultSummary`, `twoClassSummary`, `prSummary`
      - Grid Search – `tuneGrid` with `expand.grid()` for explicit tuning parameter values
      - Random Search – `tuneLength` with `search = "random"` in `trainControl()`
      - Subsampling – `sampling` option for class imbalance (down, up, SMOTE, ROSE)
      - Parallel Processing – `doMC` (macOS/Linux) and `doParallel` (Windows) via foreach
    sources:
    - path: keynotes/caret.key
      format: Keynote
    - path: powerpoints/caret.pptx
      format: PowerPoint
