  labelled:
    by: community
    old: labelled
    title: labelled
    description: Manipulate labelled data imported from Stata, SAS, or SPSS, including variable labels,
      value labels, and user-defined missing values.
    people:
    - Joseph Larmarange
    languages:
    - R
    software:
    - haven
    updated: 2020-06
    body: summary
    summary: |
      The labelled package provides functions to handle labelled data structures common in Stata, SAS, and SPSS. It manages variable labels (`var_label()`), value labels (`val_labels()`), SPSS-style user-defined missing values, and Stata/SAS-style tagged NAs, and supports converting labelled vectors to factors or plain R types.

      ## What's covered
      - Basics – labelled data structure and its three attribute types
      - Variable labels – `var_label()` and `set_variable_labels()` for reading and setting labels on vectors and data frames
      - Value labels – `val_labels()`, `val_label()`, `add_value_labels()`, and `set_value_labels()`
      - Missing values – SPSS-style `na_values()` / `na_range()` and Stata/SAS tagged NAs (`tagged_na()`, `na_tag()`)
      - When using labelled data? – guidance on converting to factors or numeric vectors before analysis
      - Conversion – `to_factor()`, `to_character()`, `remove_val_labels()`, `to_labelled()`
    sources:
    - path: powerpoints/labelled.pptx
      format: PowerPoint
  leaflet:
    by: community
    old: leaflet
    title: Leaflet
    description: Build interactive web maps in R using the leaflet package, with markers, shapes, basemaps,
      and Shiny integration.
    people:
    - Kejia Shi
    languages:
    - R
    software:
    - leaflet
    updated: 2017-05
    body: summary
    summary: |
      The leaflet package provides an R interface to the Leaflet JavaScript library for creating interactive maps. It supports map widgets, multiple basemap providers, markers, polygons, circles, GeoJSON and TopoJSON layers, and can be embedded in Shiny applications with `leafletOutput()` and `renderLeaflet()`.

      ## What's covered
      - Quick start – installation and first map with `leaflet()` and `addTiles()`
      - Map widget – `leafletOptions()`, `setView()`, `fitBounds()`, and data object formats
      - Markers – `addMarkers()`, `makeIcon()`, `addAwesomeMarkers()`, cluster options, `addCircleMarkers()`
      - Popups and labels – `addPopups()`, `addMarkers(popup=...)`, `addLabelOnlyMarkers()`
      - Lines and shapes – `addPolygons()`, `addCircles()`, `addRectangles()`
      - Basemaps – `addTiles()`, `addProviderTiles()`, `addWMSTiles()`
      - GeoJSON and TopoJSON – `addGeoJSON()`, `addTopoJSON()` with style options
      - Shiny integration – `leafletOutput()`, `renderLeaflet()`, `leafletProxy()`, `fitBounds()`, `removeShape()`
      - Object events – input event names for markers, shapes, GeoJSON, and map clicks
    sources: []
  lubridate:
    by: posit
    old: lubridate
    description: Parse, manipulate, and perform arithmetic on dates, times, and date-time objects in R
      using lubridate.
    people:
    - Garrett Grolemund
