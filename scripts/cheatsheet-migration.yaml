  mlr:
    by: community
    old: mlr
    title: Machine Learning with mlr
    description: Build, tune, and evaluate machine learning models in R using the mlr framework's unified
      interface.
    people:
    - Aaron Cooley
    languages:
    - R
    updated: 2018-02
    body: summary
    summary: |
      The mlr package provides a unified interface for supervised and unsupervised machine learning in R, covering task creation, learner configuration, resampling, performance measurement, hyperparameter tuning, and visualization. It supports classification, regression, clustering, survival, and cost-sensitive tasks.

      ## What's covered
      - Setup – `normalizeFeatures()`, `createDummyFeatures()`, `mergeSmallFactorLevels()`
      - Task creation – `makeClassifTask()`, `makeRegrTask()`, `makeClusterTask()`, `makeSurvTask()`
      - Training & testing – `makeLearner()`, `train()`, `predict()`, `performance()`, `listMeasures()`
      - Resampling – `makeResampleDesc()` for CV, LOO, RepCV, bootstrap, and holdout; `resample()`
      - Refining performance – `makeParamSet()`, `makeTuneControl*()`, `tuneParams()`
      - Configuration – `configureMlr()` for error handling and output verbosity
      - Feature extraction – `filterFeatures()` with importance-based selection methods
      - Visualization – `plotThreshVsPerf()`, `plotROCCurves()`, `plotResiduals()`
      - Wrappers – `makeDummyFeaturesWrapper()`, `makeImputeWrapper()`, `makePreprocWrapper()`
    sources: []
  mosaic:
    by: community
    old: mosaic
    title: Intro stats with mosaic
    description: Perform introductory statistics in R using mosaic's consistent formula interface for
      graphics, summary statistics, and inference.
    people: []
    languages:
    - R
    updated: 2018-02
    body: summary
    summary: |
      The mosaic package simplifies introductory statistics in R using a unified formula interface (`goal(y ~ x, data = ...)`) that works consistently across graphics, summary statistics, and hypothesis tests. It wraps common statistical operations such as `favstats()`, `t.test()`, and `binom.test()` and supports dplyr-style data management.

      ## What's covered
      - Essential R syntax – arithmetic operators, assignment, logical operators
      - Formula interface – `goal(y ~ x | z, groups = w, data = ...)` pattern for all operations
      - One categorical variable – `tally()`, `bargraph()`, `binom.test()`, `prop.test()`
      - One quantitative variable – `favstats()`, `histogram()`, `densityplot()`, `t.test()`
      - Two categorical variables – contingency tables, `mosaicplot()`, `xchisq.test()`
      - Two quantitative variables – `cor()`, `xyplot()`, `lm()`, `msummary()`
      - Data management – dplyr `select()`, `mutate()`, `filter()`, `group_by()`, `summarize()`, joins
      - Importing data – `read.file()` for local paths and URLs
      - Examining data – `inspect()`, `dim()`, `head()`, `names()`
    sources: []
  nardl:
    by: community
    old: nardl
    title: nardl
    description: Estimate nonlinear cointegrating ARDL models and run bounds tests, serial correlation,
      and heteroscedasticity diagnostics.
    people:
    - Taha Zaghdoudi
    languages:
    - R
    updated: 2018-10
    body: summary
    summary: |
      The nardl package fits nonlinear autoregressive distributed lag (NARDL) cointegration models in R, supporting automatic or fixed lag selection via information criteria. It provides Cusum and CusumQ stability plots, Pesaran-Shin-Smith bounds tests, serial correlation tests, and dynamic multiplier plots for asymmetric long-run relationships.

      ## What's covered
      - Specifying the model – `nardl()` with fixed (`p`, `q`) or automatic (`maxlags = TRUE`) lag selection
      - Cusum and CusumQ plot – parameter stability visualization with `graph = TRUE`
      - Cointegration bounds test – `pssbounds()` with Pesaran, Shin & Smith (2001) critical values
      - LM test for serial correlation – `bp2()` Breusch-Pagan test
      - Lagrange multiplier test – `ArchTest()` for ARCH conditional heteroscedasticity (Engle 1982)
      - Dynamic multipliers plot – `plotmplier()` for short- and long-run multiplier visualization
    sources: []
  nimble:
    by: community
    old: nimble
    title: nimble
    description: Write, compile, and run Bayesian hierarchical models and customizable MCMC algorithms
      using NIMBLE in R.
    people: []
    languages:
    - R
    updated: 2020-05
    body: summary
    summary: |
      NIMBLE provides a system for writing hierarchical Bayesian models in BUGS-like syntax (`nimbleCode()`), compiling them to C++ for fast execution, and running customizable MCMC samplers with `buildMCMC()` and `runMCMC()`. Models are treated as objects that expose nodes, variables, and dependency graphs for inspection and debugging.

      ## What's covered
      - NIMBLE workflow – `nimbleCode()`, `nimbleModel()`, `configureMCMC()`, `buildMCMC()`, `compileNimble()`, `runMCMC()`
      - Writing model code – stochastic (`~`), deterministic (`<-`), truncated, and constraint declarations; link functions; vectorized nodes
      - Using models – `model$calculate()`, `model$simulate()`, `model$getLogProb()`, variable access
      - Models are graphs – `getNodeNames()`, `getVarNames()`, `getDependencies()`, `expandNodeNames()`
      - Debugging models – `myModel$check()`, `initializeInfo()`, `checkBasics()`, `newModel()`
      - Distributions – univariate continuous distributions with canonical and alternative parameterizations (beta, chi-square, log-normal, logistic, inverse-gamma, and more)
    sources: []
