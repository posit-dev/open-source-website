  time-series:
    by: community
    old: time-series
    title: Time Series
    description: Simulate, filter, and forecast ARMA time series models using base R functions.
    people:
    - Yunjun Xia
    - Shuyu Huang
    languages:
    - R
    updated: 2019-10
    body: summary
    summary: |
      This cheat sheet covers the key steps of time series analysis in R using base functions:
      plotting time series, applying linear and differencing filters, fitting AR and ARMA models,
      and forecasting future observations with confidence intervals.

      ## What's covered
      - Plot time series – `tsplot`, `plot(ts(...))`, `ts.plot`
      - Linear filter – `filter` with convolution method
      - Differencing filter – `diff` with lag and differences arguments
      - Simulation – `arima.sim` for AR(p), MA(q), and ARMA(p,q) models
      - Auto-correlation – ACF with `acf`, PACF with `pacf`
      - Parameter estimation – `ar` for AR models, `arima` for ARMA models
      - Model comparison – `AICc` for comparing fitted models
      - Forecasting – `predict` and plotting predicted values with confidence intervals
    sources:
    - path: keynotes/time-series.key
      format: Keynote
  torch:
    by: community
    old: torch
    title: Deep learning with torch
    description: Build and train deep learning models in R using the torch package and its PyTorch backend.
    people:
    - Christophe Regouby
    languages:
    - R
    software:
    - torch
    updated: 2023-02
    body: summary
    summary: |
      The torch R package is based on PyTorch and provides a flexible low-level interface for building
      neural networks with optional GPU acceleration. It supports defining custom modules, assembling
      sequential networks, training loops, and a broad set of layer types for image, text, and tabular data.

      ## What's covered
      - Working with torch models – `nn_module`, `nn_sequential`, model fit and evaluation
      - Optimization – `optim_sgd`, `optim_adam`
      - Classification loss functions – `nn_cross_entropy_loss`, `nn_bce_loss`, `nn_nll_loss`, and others
      - Regression loss functions – `nn_l1_loss`, `nn_mse_loss`, `nn_kl_div_loss`, and others
      - Neural-network layers – `nn_linear`, `nn_sigmoid`, `nn_relu`, `nn_dropout`, `nn_batch_norm1d`
      - Convolutional layers – `nn_conv1d`, `nn_conv2d`, `nn_conv3d`, transposed convolutions
      - Pooling layers – max pooling, average pooling, and adaptive pooling (1D–3D)
      - Recurrent layers – `nn_rnn`, `nn_gru`, `nn_lstm`
      - Tensor manipulation – creation, shape operations, slicing, concatenation, and value operations
      - Pre-trained models and importing from PyTorch
    sources:
    - path: keynotes/torch.key
      format: Keynote
    translations:
    - file: translations/french/torch_fr.pdf
      language: French
      lang: fr
      edition: torch 0.9.0
      updated: 2023-02
      people:
      - Christophe Regouby
      source: translations/french/torch_fr.key
  tsbox:
    by: community
    old: tsbox
    title: Class agnostic time series with tsbox
    description: Convert, combine, and transform time series across all major R time series classes using
      tsbox.
    people:
    - Christoph Sax
    languages:
    - R
    updated: 2019-04
    body: summary
    summary: |
      tsbox provides a class-agnostic toolkit that works identically with ts, xts, zoo, data.frame,
      tibble, data.table, tsibble, and other time series classes. All functions start with `ts_` and
      return an object of the same class as the input, handling both regular and irregular frequencies.

      ## What's covered
      - Basics – the `ts_` prefix convention and combining time series with `ts_c` and `ts_bind`
      - Class conversion – `ts_ts`, `ts_df`, `ts_xts`, `ts_tbl`, `ts_zoo`, `ts_tsibble`, `ts_tslist`
      - Helper functions – `ts_trend`, `ts_pc`, `ts_pcy`, `ts_scale`, `ts_index`, `ts_seas`, `ts_lag`
      - Span and frequency operations
      - Time series in data frames – long structure and auto-detect column names
    sources: []
  vegan:
    by: community
    old: vegan
    title: vegan
    description: Analyze ecological community data with ordination, diversity indices, and dissimilarity
      measures.
    people:
    - Bruna Luiza Silva
    languages:
    - R
    updated: 2020-04
    body: summary
    summary: |
      The vegan package provides tools for descriptive community ecology, including ordination methods,
      diversity analysis, and dissimilarity indices. Most multivariate tools can also be applied to
      non-ecological data types.

      ## What's covered
      - Unconstrained ordination – `metaMDS`, `plot`, `ordihull`, `ordiellipse`, `ordispider`
      - Constrained ordination – `cca`, `rda`, `capscale`
      - Analysis of constraints – `anova.cca` permutation test
      - Diversity analysis – `diversity` (Shannon, Simpson, Fisher), `renyi`, `rarefy`
      - Taxonomic diversity – `taxondive`, `taxa2dist`
      - Ranked abundance distribution – `radfit`, `rad.null`
      - Beta diversity – `betadiver`
      - Analysis of diversity in groups – `anosim`
      - Dissimilarity analysis – `vegdist` with multiple index options
      - Other features – `vegemite`, `tabasco`, `beals`
    sources: []
  vivainsights-py:
    by: community
    old: vivainsights_py
    title: vivainsights (Python)
    description: Analyze and visualize Microsoft Viva Insights data using the vivainsights Python package.
    people:
    - Martin Chan
    languages:
    - Python
    updated: 2025-01
    body: summary
    summary: |
      The vivainsights Python package provides tools for importing, validating, and visualizing
      Microsoft Viva Insights query data. It mirrors the R package's design with functions for
      flexible metric analysis, network visualization, and inequality measurement.

      ## What's covered
      - Basics and setup – installation via pip and example workflow
      - Data import and export – `import_query`, `export`
      - Inbuilt datasets – `load_pq_data`, `load_mt_data`, `load_g2g_data`, `p2p_data_sim`
      - Data validation – `identify_holidayweeks`, `identify_inactiveweeks`, `identify_nkw`
      - Flexible analysis – `create_bar`, `create_boxplot`, `create_inc`, `create_line`, `create_sankey`
      - Network analysis – `network_g2g`, `network_p2p`
      - Exploratory analysis – `keymetrics_scan`, `create_rank`
      - Other analysis – `create_IV`, `p_test`, `compute_gini`, `create_lorenz`
    sources:
    - path: powerpoints/vivainsights-r-py.pptx
      format: PowerPoint
  vivainsights-r:
    by: community
    old: vivainsights_r
    title: vivainsights (R)
    description: Analyze and visualize Microsoft Viva Insights data using the vivainsights R package.
    people:
    - Martin Chan
    languages:
    - R
    updated: 2024-11
    body: summary
    summary: |
      The vivainsights R package provides functions for importing, validating, and visualizing
      Microsoft Viva Insights query data. Metric analysis functions combine a prefix (e.g., `collab_`,
      `email_`) with a plot type suffix (e.g., `_summary`, `_dist`) for rapid exploratory analysis.

      ## What's covered
      - Basics and setup – installation, companion tidyverse workflow
      - Data import and export – `import_query`, `export`
      - Inbuilt datasets – `pq_data`, `mt_data`, `p2p_data`, `p2p_data_sim`
      - Data validation – `validation_report`, `hrvar_count`, `identify_holidayweeks`, `identify_nkw`, `identify_outlier`
      - Basic analysis – metric prefix functions (`*_summary`, `*_dist`, `*_fizz`, `*_line`, `*_trend`, `*_rank`)
      - Exploratory analysis – `keymetrics_scan`, `create_rank`
      - Distribution – `create_boxplot`, `create_density`, `create_hist`
      - Flexible analysis – `create_bar`, `create_fizz`, `create_scatter`, `create_bubble`, `create_dist`, `create_inc`
      - Flexible analysis over time – `create_line`, `create_period_scatter`, `create_trend`, `create_tracking`
      - Network analysis – `network_g2g`, `network_p2p`, `network_summary`
      - Other analysis – `create_IV`, `create_lorenz`, `maxmin`
      - Helper functions – `anonymise`, `totals_bind`, `tstamp`, `wrap_text`
    sources:
    - path: powerpoints/vivainsights-r-py.pptx
      format: PowerPoint
  vtree:
    by: community
    old: vtree
    title: Examining nested subsets with vtree
    description: Display nested variable subsets as a tree to count and summarize data subgroups.
    people:
    - Nick Barrowman
    languages:
    - R
    updated: 2019-06
    body: summary
    summary: |
      vtree creates graphical displays of nested subsets of a data frame, organizing observations into
      a tree by combinations of variable categories. It supports custom numerical summaries, pruning
      of branches, pattern tables, and flexible text and image formatting.

      ## What's covered
      - Basic usage – calling `vtree` with one or more variable names
      - Summaries – `%mean%`, `%SD%`, `%sum%`, `%median%`, `%freqpct%`, `%npct%`, `%list%`
      - Pruning – `prune`, `keep`, `prunebelow`, `follow`
      - Variable specification – suffixes (`#`, `*`, `@`) and prefixes (`is.na:`, `i:`, `any:`, `all:`)
      - Labels – `labelvar`, `labelnode`, `showvarnames`, `showlegend`, `title`
      - Pattern trees and tables – `pattern=T`, `ptable=T`
      - Image settings – `imagewidth`, `imageheight`, `pxwidth`
      - Frequencies and percentages – `vp`, `showpct`, `showcount`
      - Text formatting – `splitwidth`, bold, italic, color markup
