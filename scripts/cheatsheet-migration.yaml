  golem:
    by: community
    old: golem
    title: golem
    description: Build, maintain, and deploy production-grade Shiny applications as R packages using the
      golem framework.
    people: []
    languages:
    - R
    updated: 2019-06
    body: summary
    summary: |
      golem is an opinionated framework for creating robust Shiny applications structured as R packages. It scaffolds a standardized project layout and provides helper functions across the full development lifecycle: initial setup, day-to-day module and asset development, and deployment to multiple targets.

      ## What's covered
      - Create a golem – via RStudio New Project wizard or `golem::create_golem()`
      - Set up your golem – `fill_desc()`, `set_golem_options()`, recommended tests and dependencies
      - Launch and inspect the app – `dev/run_dev.R`, `document_and_reload()`
      - Customise – add Shiny modules (`add_module()`), JS files, CSS files, built-in JS functions
      - Exhibit your golem locally – `remotes::install_local()`
      - Deploy to RStudio products – `add_rstudioconnect_file()`, `add_shinyappsio_file()`
      - Deploy with Docker – `add_dockerfile()`, `add_dockerfile_shinyproxy()`
      - Tips and tricks – `print_dev()`, `make_dev()`, `browser_button()`
    sources: []
  great-tables:
    by: posit
    old: great-tables
    description: Make display tables from Python DataFrames (Polars, Pandas, and Arrow) with formatting,
      styling, and output to HTML or LaTeX.
    people:
    - Mine Çetinkaya-Rundel
    - Rich Iannone
    software:
    - great-tables
    updated: 2026-08
    body: summary
    summary: |
      Great Tables is a Python package for building display tables from Polars, Pandas, or Arrow DataFrames. It mirrors the gt API closely and is designed for use in notebooks and Quarto documents, with options to save table images or export HTML and LaTeX.

      ## What's covered
      - Introduction – package overview and sample datasets
      - Creating a GT Table – `GT()`, basic workflow, and Polars style property
      - Adding Structure – `tab_header()`, `tab_source_note()`, stub and row groups, column spanners
      - Formatting Data Values – `fmt_number()`, `fmt_integer()`, `fmt_percent()`, `fmt_scientific()`, `fmt_date()`, `fmt_time()`, `fmt_datetime()`, `fmt_image()`, `fmt_icon()`, `fmt_flag()`
      - Colorizing Body Cells – `data_color()` with domain, palette, and NA color options
      - Adding Nanoplots – `fmt_nanoplot()` for inline sparklines
      - Styling the Table – `tab_style()` with `style.fill()`, `style.text()`, `style.borders()`, and `loc.*` location helpers
      - Table-wide options – `tab_options()`, `opt_stylize()`, `opt_table_font()`
    sources:
    - path: keynotes/great-tables.key
      format: Keynote
  gt:
    by: posit
    old: gt
    description: Create display tables from R data frames with formatting, styling, and output to HTML,
      PDF, LaTeX, and Word.
    people:
    - Mine Çetinkaya-Rundel
    - Rich Iannone
    software:
    - gt
    updated: 2026-08
    body: summary
    summary: |
      The gt package lets you turn R data frames into display tables by structuring, formatting, and styling every element. It is well-suited for Shiny apps, Quarto documents, and standalone HTML or PDF reports. All formatting is done through a consistent, pipeable API.

      ## What's covered
      - Introduction – package overview and sample datasets
      - Creating a gt Table – `gt()`, basic workflow, and `exibble` example
      - Adding Structure – `tab_header()`, `tab_source_note()`, `tab_footnote()`, stub and row groups, column spanners, `row_group_order()`
      - Formatting Data Values – `fmt_number()`, `fmt_integer()`, `fmt_percent()`, `fmt_scientific()`, `fmt_date()`, `fmt_time()`, `fmt_datetime()`, `fmt_image()`, `fmt_icon()`, `fmt_flag()`
      - Colorizing Body Cells – `data_color()` with domain and palette options
      - Adding Nanoplots – `cols_nanoplot()` for inline sparklines
      - Styling the Table – `tab_style()` with `cell_fill()`, `cell_text()`, `cell_borders()`, and location helpers
      - Table-wide options – `tab_options()`, `opt_stylize()`, `opt_table_font()`
    sources:
    - path: keynotes/gt.key
      format: Keynote
  gtsummary:
    by: community
    old: gtsummary
    title: gtsummary
    description: Produce descriptive, regression, and survival summary tables from R data frames and model
      objects.
    people:
    - Esther Drill
    languages:
    - R
    updated: 2022-04
    body: summary
    summary: |
      gtsummary turns R data frames and model objects into formatted, customizable tables suitable for publication. A consistent set of add-on functions applies across all table types for adding p-values, overall columns, and formatting.

      ## What's covered
      - `tbl_summary()` – descriptive statistics for continuous, categorical, and dichotomous variables
      - `tbl_svysummary()` – survey-weighted descriptive tables
      - Customization arguments – `by`, `label`, `statistic`, `digits`, `type`, `value`, `missing`
      - `add_p()` – p-value column with configurable statistical tests
      - `add_n()`, `add_overall()`, `add_q()` – additional columns
      - `bold_p()`, `bold_labels()` – formatting helpers
      - `tbl_regression()` – formatted regression model output with exponentiation option
      - `tbl_survfit()` – time-to-event estimates from survfit objects
    sources:
