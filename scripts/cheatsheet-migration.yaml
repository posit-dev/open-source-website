  declaredesign:
    by: community
    old: declaredesign
    title: DeclareDesign
    description: Declare research designs using the MIDA framework and diagnose their properties via Monte
      Carlo simulation.
    people:
    - Graeme Blair
    - Jasper Cooper
    - Alexander Coppock
    - Macartan Humphreys
    - Neal Fultz
    languages:
    - R
    updated: 2019-04
    body: summary
    summary: |
      DeclareDesign is an R implementation of the MIDA framework, in which a research design has a Model of the world, an Inquiry, a Data strategy, and an Answer strategy. Each component is declared as a composable R function; designs are combined with `+` and diagnosed using Monte Carlo simulation to estimate properties such as power and bias.

      ## What's covered
      - Model – `declare_population()` for simple and hierarchical datasets, `declare_potential_outcomes()`
      - Inquiry – `declare_estimand()` for causal, descriptive, and conditional estimands
      - Data strategy – `declare_sampling()` and `declare_assignment()` with stratification and clustering
      - Answer strategy – `declare_estimator()` for OLS, 2SLS, and difference-in-means
      - Design declaration – combining components with `+`
      - Design diagnosis – `diagnose_design()`, `summary()`, custom diagnosands
    sources: []
  distr6:
    by: community
    old: distr6
    title: Create, query and manipulate distributions with distr6
    description: Work with probability distributions as R6 objects, with flexible parameterizations, properties,
      decorators, and composite wrappers.
    people:
    - Raphael Sonabend
    languages:
    - R
    updated: 2019-08
    body: summary
    summary: |
      distr6 provides a unified object-oriented interface for probability distributions using R6 classes. It implements a wide range of distributions and kernels, supports multiple parameterizations for each, and allows distributions to be extended via decorators for numerical imputation or combined into composites via wrappers. Every R6 method also has an S3 dispatch available.

      ## What's covered
      - Introduction and R6 class hierarchy – Distribution, SDistribution, Kernel, Decorator, Wrapper, ParameterSet
      - R6 basics – dollar-sign method notation
      - Construct a distribution – default and alternative parameterizations
      - Get and set parameters – `$parameters()`, `$getParameterValue()`, `$setParameterValue()`
      - Properties and traits – `$support()`, `$symmetry()`, `$kurtosis()`, `$skewness()`
      - S3 and piping – S3 equivalents and magrittr `%>%` method chaining
      - Multivariate distributions – `MultivariateNormal` and other multivariate classes
    sources: []
  dromics:
    by: community
    old: DRomics
    title: DRomics
    description: Fit dose-response models to omics data, compute benchmark doses, and visualize results
      for multi-level biological annotation.
    people:
    - Aurélie Siberchicot
    languages:
    - R
    updated: 2023-01
    body: summary
    summary: |
      DRomics provides a structured workflow for analyzing dose-response relationships in omics datasets, including microarray, RNA-seq, continuous omics, and anchoring data. The workflow covers data import and preprocessing, selection of significantly responsive items, dose-response model fitting, benchmark dose (BMD) calculation, and bootstrap confidence intervals.

      ## What's covered
      - Format of data – identifiers, doses, and signal columns
      - Step 1 – import, check, and pretreatment (`microarraydata()`, `RNAseqdata()`, `PCAdataplot()`)
      - Step 2 – selection of significantly responsive items (`itemselect()`)
      - Step 3 – dose-response modelling (`drcfit()`)
      - Step 4 – computation of benchmark doses (`bmdcalc()`)
      - Step 5 – bootstrap confidence intervals (`bmdboot()`)
      - Typical workflow script
      - BMD plot – `bmdplot()` and `bmdplotwithgradient()`
      - Trend plot – `trendplot()`
      - Sensitivity plot – `sensitivityplot()`
      - Dose-response curves plot – `curvesplot()`
    sources:
    - path: powerpoints/DRomics.pptx
      format: PowerPoint
  estadistica-descriptiva-con-r:
    by: community
    old: estadistica-descriptiva-con-R
    old_pdf: translations/spanish/estadistica-descriptiva-con-R.pdf
    title: Estadística descriptiva con R
    description: Compute descriptive statistics and create ggplot2 visualizations for numeric and categorical
      variables in R.
    people:
    - Rosana Ferrero
    languages:
    - R
    updated: 2018-06
    body: summary
    summary: |
      This cheat sheet is in Spanish. It covers descriptive statistics and exploratory visualization
      in R, using the `mtcars` dataset as a running example. Summary functions and ggplot2 plot types
      are shown for single variables and combinations of numeric and categorical variables.

      ## What's covered
      - Basic concepts – visualizing data with `head`, `View`, `str`; variable types
      - Numeric summaries for one categorical variable – `table`, `prop.table`, `ftable`
      - Numeric summaries for one or more numeric variables – `mean`, `by`, `plyr::ddply`, `summary`
      - Measures of central tendency – `mean`, `median`, `DescTools::Mode`
      - Non-central position – `quantile`
      - Dispersion – `var`, `sd`, `IQR`, trimmed standard error
      - Shape – `skewness`, `kurtosis`
      - Plots for one numeric variable – `geom_histogram`, `geom_density`, `geom_boxplot`
      - Plots for one categorical variable – `geom_bar`
      - Plots for one numeric and one categorical variable – `geom_histogram`, `geom_density`
      - Facets – `facet_grid`, `facet_wrap`
    sources: []
  estimatr:
    by: community
    old: estimatr
    title: estimatr
    description: Fit OLS, 2SLS, and two-group estimators with design-appropriate robust and clustered
      standard errors.
    people:
    - Graeme Blair
    - Jasper Cooper
    - Alexander Coppock
    - Macartan Humphreys
    - Luke Sonnet
    languages:
    - R
    updated: 2018-11
    body: summary
    summary: |
      estimatr is part of the DeclareDesign suite and provides fast linear and instrumental variables estimators with robust standard errors designed for experimental and observational research. It covers OLS with `lm_robust()`, two-stage least squares with `iv_robust()`, fixed-effects regression, and two-group estimators, with ggplot2 and texreg integrations.

      ## What's covered
      - OLS with `lm_robust()` – HC2 default, SE type options
      - Clustered standard errors – CR2 default
      - Fixed effects – dummies approach and `fixed_effects` absorbing approach
      - 2SLS with `iv_robust()` – clustered IV regression
      - Two-group estimators – `difference_in_means()`, `horvitz_thompson()`
      - Post-estimation commands – `tidy()`, `vcov()`, `confint()`, `predict()`
      - ggplot2 integration – `stat_smooth(method = "lm_robust")`
      - Multiple models – same outcome different subsets, different outcomes same subset
      - Extras – Lin covariate adjustment (`lm_lin()`), texreg tables
      - estimatr-to-Stata dictionary
    sources: []
  eurostat:
    by: community
    old: eurostat
    title: Access Eurostat data with eurostat
    description: Search, download, label, and visualize data from the Eurostat Open Data portal using
      R.
    people:
    - Przemysław Biecek
    - Markus Kainu
    languages:
    - R
    updated: 2017-03
    body: summary
    summary: |
      The eurostat package provides a complete R interface to the Eurostat Open Data portal. Key functions allow users to find table codes, download tables as tibbles, add human-readable labels, and produce plots and choroplethmaps of the retrieved data.

      ## What's covered
      - Find the table code – `search_eurostat()` to scan the Eurostat directory
      - Download the table – `get_eurostat()` with time format, filters, and caching
      - Add labels – `label_eurostat()` to replace codes with descriptions
      - eurostat and plots – combining with ggplot2 and dplyr for time-series plots
      - eurostat and maps – `get_eurostat_geospatial()` with sf and `ggplot2::geom_sf()`
    sources: []
