  quincunx:
    by: community
    old: quincunx
    title: PGS Catalog access with quincunx
    description: Access the PGS Catalog database of published polygenic scores from R using quincunx's
      REST API interface.
    people:
    - Ramiro Magno
    languages:
    - R
    updated: 2021-05
    body: summary
    summary: |
      The quincunx package provides programmatic access to the PGS Catalog, a curated repository of published polygenic scores maintained by EMBL-EBI and the University of Cambridge. It maps the five core catalog entities—scores, publications, sample sets, performance metrics, and traits—to S4 objects in R, and supports retrieval by PGS ID, EFO ID, PubMed ID, author, or trait term.

      ## What's covered
      - Introduction – PGS Catalog overview and REST API structure
      - PGS Catalog entities in R – S4 classes for scores, publications, sample sets, performance metrics, and traits with tidy relational tables
      - Get PGS Catalog entities – retrieval functions with `pgs_id`, `pgp_id`, `pss_id`, `efo_id`, and `pubmed_id` query criteria
      - Other S4 entities – `trait_categories`, `cohorts`, `releases`
      - Cohorts, samples, and sample sets – data structure, identifiers, and demographics tables
      - PGS construction process – GWAS samples, polygenic score derivation, and performance metrics
      - Polygenic scoring file – file format description and field reference
    sources:
    - path: inkscape/quincunx_cheatsheet_page01.svg
      format: Inkscape (SVG, page 1)
    - path: inkscape/quincunx_cheatsheet_page02.svg
      format: Inkscape (SVG, page 2)
  r-best-practice:
    by: community
    old: R-best-practice
    title: Best Practice for R
    description: Recommended tools, project structure, function design, and coding style for writing maintainable
      R code.
    people:
    - Jacob Scott
    languages:
    - R
    software:
    - usethis
    - reprex
    - renv
    updated: 2023-11
    body: summary
    summary: |
      This cheat sheet summarizes best practices for R development, covering IDE and tooling choices, project structure with renv, recommended package ecosystems for common tasks, guidelines for writing clean functions, and code style conventions from the Tidyverse style guide. It includes a workflow for writing minimal reproducible examples with `reprex::reprex()`.

      ## What's covered
      - Software – RStudio, Quarto, git, and GitHub for version control and collaboration
      - Packages – tidyverse, tidymodels, shiny, renv, and when to trust a package (GitHub stars heuristic)
      - Project creation and structure – directory layout, `.gitignore`, `renv.lock`, `run-all.R`
      - Databases – `{DBI}` and `{odbc}` connection helper functions
      - Getting help – `reprex::reprex()`, etiquette for Teams and Stack Overflow
      - Functions – writing workflow, verb-like naming conventions
      - Styling – `lower_snake_case`, whitespace around operators, 80-character line limit, indentation rules
    sources:
    - path: keynotes/R-best-practice.key
      format: Keynote
  randomizr:
    by: community
    old: randomizr
    title: randomizr
    description: Conduct simple, complete, block, cluster, and block-and-cluster random assignment for
      experimental research designs.
    people:
    - Alexander Coppock
    languages:
    - R
    updated: 2018-06
    body: summary
    summary: |
      The randomizr package implements randomization procedures for experimental research, including simple, complete, block, cluster, and block-and-cluster random assignment. Each assignment function has a sampling analogue, and `declare_ra()` allows researchers to inspect and diagnose assignment procedures before conducting a study.

      ## What's covered
      - Two-arm trials – `simple_ra()`, `complete_ra()`, `block_ra()`, `cluster_ra()`, `block_and_cluster_ra()`
      - Multi-arm trials – `num_arms`, `conditions`, and `*_each` arguments for multi-arm designs
      - Block designs – `block_m_each` and `block_prob_each` for block-varying probability designs
      - Declaration – `declare_ra()`, `conduct_ra()`, `obtain_condition_probabilities()`
      - Sampling – `simple_rs()`, `complete_rs()`, `strata_rs()`, `cluster_rs()`, `strata_and_cluster_rs()`
      - Stata – equivalent Stata version of the package via `ssc install randomizr`
    sources: []
  regular-expressions:
    by: community
    old: regex
    title: Regular expressions
    description: Reference for regex syntax and base R and stringr functions for detecting, locating,
      extracting, and replacing string patterns.
    people:
    - Ian Kopacka
    languages:
    - R
    software:
    - stringr
    updated: 2019-07
    body: summary
    summary: |
      This cheat sheet covers regular expression syntax for use in R, including character classes, anchors, quantifiers, and lookaheads, alongside the main base R functions (`grep()`, `grepl()`, `sub()`, `gsub()`, `regexpr()`) and their stringr equivalents (`str_detect()`, `str_extract()`, `str_replace()`). It also explains POSIX classes, PCRE-only features, greedy versus lazy matching, and case-insensitive mode.

      ## What's covered
      - Character classes – POSIX classes (`[[:digit:]]`, `[[:alpha:]]`), `\\d`, `\\w`, `\\s` and complements
      - Special characters – escape sequences `\n`, `\t`, `\r`, `\v`, `\f`
      - Anchors and word boundaries – `^`, `$`, `\\b`, `\\B`, `\\<`, `\\>`
      - Quantifiers – `*`, `+`, `?`, `{n}`, `{n,m}`; greedy vs. lazy with `?` and `(?U)`
      - Grouping and alternation – `(…)`, `|`, `[…]`, `[^…]`, back references
      - Lookahead and lookbehind – `(?=)`, `(?!)`, `(?<=)`, `(?<!)` (PCRE, requires `perl = TRUE`)
      - Detect and locate – `grep()`, `grepl()`, `regexpr()`, `gregexpr()`, `str_detect()`, `str_locate()`
      - Extract and replace – `regmatches()`, `str_extract()`, `str_match()`, `sub()`, `gsub()`, `str_replace()`
    sources:
    - path: powerpoints/regex.pptx
      format: PowerPoint
    translations:
